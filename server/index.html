<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw</title>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@EXCALIDRAW_VERSION_PLACEHOLDER/dist/prod/index.css" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react-dom": "https://esm.sh/react-dom@19.0.0",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
      "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
      "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@EXCALIDRAW_VERSION_PLACEHOLDER/dist/prod/index.js?external=react,react-dom"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    #status {
      position: fixed;
      bottom: 8px;
      right: 8px;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      z-index: 10000;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #status.saved { background: #2d7d46; color: #fff; }
    #status.saving { background: #b8860b; color: #fff; }
    #status.unsaved { background: #666; color: #fff; }
    #status.error { background: #c0392b; color: #fff; }
    #status.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="status" class="saved">Saved</div>

  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { jsx } from "react/jsx-runtime";
    import { Excalidraw } from "@excalidraw/excalidraw";

    const params = new URLSearchParams(window.location.search);
    const filePath = params.get("file");
    const theme = params.get("theme") || "dark";
    const debounceMs = parseInt(params.get("debounce") || "1000", 10);
    const libraryPath = params.get("library");

    const statusEl = document.getElementById("status");
    let statusTimeout = null;

    function setStatus(state, text) {
      statusEl.className = state;
      statusEl.textContent = text || state.charAt(0).toUpperCase() + state.slice(1);
      clearTimeout(statusTimeout);
      if (state === "saved") {
        statusTimeout = setTimeout(() => statusEl.classList.add("hidden"), 2000);
      }
    }

    if (!filePath) {
      const errorDiv = document.createElement("div");
      errorDiv.style.padding = "20px";
      errorDiv.style.fontFamily = "sans-serif";
      errorDiv.textContent = "Error: No file path specified.";
      document.getElementById("root").appendChild(errorDiv);
      throw new Error("No file path");
    }

    document.title = filePath.split("/").pop() + " - Excalidraw";

    // Load file content
    let initialData = null;
    try {
      const resp = await fetch(`/api/file?path=${encodeURIComponent(filePath)}`);
      if (resp.ok) {
        initialData = await resp.json();
      } else {
        const err = await resp.json();
        console.error("Failed to load file:", err);
      }
    } catch (e) {
      console.error("Failed to load file:", e);
    }

    // Load library
    let libraryItems = [];
    if (libraryPath) {
      try {
        const resp = await fetch(`/api/library`);
        if (resp.ok) {
          const libData = await resp.json();
          libraryItems = libData.libraryItems || [];
        }
      } catch (e) {
        console.error("Failed to load library:", e);
      }
    }

    // Library save (debounced)
    let librarySaveTimer = null;
    let currentLibraryItems = libraryItems;

    async function saveLibraryToServer(items) {
      if (!libraryPath) return;
      const data = buildLibraryPayload(items);
      try {
        setStatus("saving", "Library saving...");
        const resp = await fetch(`/api/library`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!resp.ok) {
          const err = await resp.json();
          console.error("Library save failed:", err);
          setStatus("error", "Library save failed");
        } else {
          setStatus("saved", "Library saved");
        }
      } catch (e) {
        console.error("Library save failed:", e);
        setStatus("error", "Library save failed");
      }
    }

    function handleLibraryChange(items) {
      currentLibraryItems = items;
      clearTimeout(librarySaveTimer);
      librarySaveTimer = setTimeout(() => {
        saveLibraryToServer(items);
      }, debounceMs);
    }

    // Debounced save
    let saveTimer = null;
    let saving = false;

    function buildFilePayload(elements, appState, files) {
      return {
        type: "excalidraw",
        version: 2,
        source: "markdown-excalidraw.nvim",
        elements: elements,
        appState: {
          gridSize: appState?.gridSize,
          viewBackgroundColor: appState?.viewBackgroundColor,
        },
        files: files || {},
      };
    }

    function buildLibraryPayload(items) {
      return {
        type: "excalidrawlib",
        version: 2,
        source: "markdown-excalidraw.nvim",
        libraryItems: items,
      };
    }

    async function saveToServer(elements, appState, files) {
      saving = true;
      setStatus("saving", "Saving...");

      const data = buildFilePayload(elements, appState, files);

      try {
        const resp = await fetch(`/api/file?path=${encodeURIComponent(filePath)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (resp.ok) {
          setStatus("saved", "Saved");
        } else {
          const err = await resp.json();
          setStatus("error", "Error: " + (err.error || "Save failed"));
        }
      } catch (e) {
        setStatus("error", "Error: " + e.message);
      }
      saving = false;
    }

    function handleChange(elements, appState, files) {
      setStatus("unsaved", "Unsaved");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveToServer(elements, appState, files);
      }, debounceMs);
    }

    // Before unload: save immediately
    window.addEventListener("beforeunload", (e) => {
      if (saveTimer) {
        clearTimeout(saveTimer);
        const elements = window._excalidrawAPI?.getSceneElements();
        const appState = window._excalidrawAPI?.getAppState();
        const files = window._excalidrawAPI?.getFiles();
        if (elements) {
          navigator.sendBeacon(
            `/api/file?path=${encodeURIComponent(filePath)}`,
            JSON.stringify(buildFilePayload(elements, appState, files))
          );
        }
      }
      // Save library on unload
      if (libraryPath && librarySaveTimer && currentLibraryItems) {
        clearTimeout(librarySaveTimer);
        const libItems = window._excalidrawAPI?.getLibrary?.() || currentLibraryItems;
        navigator.sendBeacon(
          `/api/library`,
          JSON.stringify(buildLibraryPayload(libItems))
        );
      }
    });

    // Build initial scene
    const initialScene = {};
    if (initialData) {
      if (initialData.elements) initialScene.elements = initialData.elements;
      if (initialData.appState) initialScene.appState = initialData.appState;
      if (initialData.files) initialScene.files = initialData.files;
    }

    function App() {
      return jsx(
        "div",
        {
          style: { width: "100vw", height: "100vh" },
          children: jsx(Excalidraw, {
            theme: theme,
            initialData: Object.keys(initialScene).length > 0 ? initialScene : undefined,
            libraryItems: libraryPath ? libraryItems : undefined,
            onChange: handleChange,
            onLibraryChange: libraryPath ? handleLibraryChange : undefined,
            excalidrawAPI: async (api) => {
              window._excalidrawAPI = api;
              if (libraryPath && libraryItems.length > 0) {
                await api.updateLibrary({ libraryItems });
              }
            },
          }),
        }
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(jsx(App, {}));
  </script>
</body>
</html>
