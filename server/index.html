<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw</title>
  <link rel="stylesheet" href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css" />
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.0.0",
      "react-dom": "https://esm.sh/react-dom@19.0.0",
      "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
      "react/jsx-runtime": "https://esm.sh/react@19.0.0/jsx-runtime",
      "@excalidraw/excalidraw": "https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.js?external=react,react-dom"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    #status {
      position: fixed;
      bottom: 8px;
      right: 8px;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      z-index: 10000;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #status.saved { background: #2d7d46; color: #fff; }
    #status.saving { background: #b8860b; color: #fff; }
    #status.unsaved { background: #666; color: #fff; }
    #status.error { background: #c0392b; color: #fff; }
    #status.hidden { opacity: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="status" class="saved">Saved</div>

  <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { jsx } from "react/jsx-runtime";
    import { Excalidraw } from "@excalidraw/excalidraw";

    const params = new URLSearchParams(window.location.search);
    const filePath = params.get("file");
    const theme = params.get("theme") || "dark";
    const debounceMs = parseInt(params.get("debounce") || "1000", 10);

    const statusEl = document.getElementById("status");
    let statusTimeout = null;

    function setStatus(state, text) {
      statusEl.className = state;
      statusEl.textContent = text || state.charAt(0).toUpperCase() + state.slice(1);
      clearTimeout(statusTimeout);
      if (state === "saved") {
        statusTimeout = setTimeout(() => statusEl.classList.add("hidden"), 2000);
      }
    }

    if (!filePath) {
      document.getElementById("root").innerHTML =
        '<p style="padding:20px;font-family:sans-serif;">Error: No file path specified.</p>';
      throw new Error("No file path");
    }

    document.title = filePath.split("/").pop() + " - Excalidraw";

    // Load file content
    let initialData = null;
    try {
      const resp = await fetch(`/api/file?path=${encodeURIComponent(filePath)}`);
      if (resp.ok) {
        initialData = await resp.json();
      } else {
        const err = await resp.json();
        console.error("Failed to load file:", err);
      }
    } catch (e) {
      console.error("Failed to load file:", e);
    }

    // Debounced save
    let saveTimer = null;
    let saving = false;

    async function saveToServer(elements, appState, files) {
      saving = true;
      setStatus("saving", "Saving...");

      const data = {
        type: "excalidraw",
        version: 2,
        source: "excalidraw.nvim",
        elements: elements,
        appState: {
          gridSize: appState.gridSize,
          viewBackgroundColor: appState.viewBackgroundColor,
        },
        files: files || {},
      };

      try {
        const resp = await fetch(`/api/file?path=${encodeURIComponent(filePath)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (resp.ok) {
          setStatus("saved", "Saved");
        } else {
          const err = await resp.json();
          setStatus("error", "Error: " + (err.error || "Save failed"));
        }
      } catch (e) {
        setStatus("error", "Error: " + e.message);
      }
      saving = false;
    }

    function handleChange(elements, appState, files) {
      if (!elements || elements.length === 0) return;
      setStatus("unsaved", "Unsaved");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveToServer(elements, appState, files);
      }, debounceMs);
    }

    // Before unload: save immediately
    window.addEventListener("beforeunload", (e) => {
      if (saveTimer) {
        clearTimeout(saveTimer);
        const elements = window._excalidrawAPI?.getSceneElements();
        const appState = window._excalidrawAPI?.getAppState();
        const files = window._excalidrawAPI?.getFiles();
        if (elements) {
          // Synchronous beacon for last-chance save
          const data = {
            type: "excalidraw",
            version: 2,
            source: "excalidraw.nvim",
            elements: elements,
            appState: {
              gridSize: appState?.gridSize,
              viewBackgroundColor: appState?.viewBackgroundColor,
            },
            files: files || {},
          };
          navigator.sendBeacon(
            `/api/file?path=${encodeURIComponent(filePath)}`,
            JSON.stringify(data)
          );
        }
      }
    });

    // Build initial scene
    const initialScene = {};
    if (initialData) {
      if (initialData.elements) initialScene.elements = initialData.elements;
      if (initialData.appState) initialScene.appState = initialData.appState;
      if (initialData.files) initialScene.files = initialData.files;
    }

    function App() {
      return jsx(
        "div",
        {
          style: { width: "100vw", height: "100vh" },
          children: jsx(Excalidraw, {
            theme: theme,
            initialData: Object.keys(initialScene).length > 0 ? initialScene : undefined,
            onChange: handleChange,
            excalidrawAPI: (api) => { window._excalidrawAPI = api; },
          }),
        }
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(jsx(App, {}));
  </script>
</body>
</html>
